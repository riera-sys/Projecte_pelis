<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estils.css">
    <title>Pelis Ghibli</title>
</head>


<body class="container text-center mt-4">
    <h1>Peli de l'estudi Ghibli</h1>
    <button type="button" class="btn btn-info mb-3" id="novaPeli">Nova Peli</button>
    <form class="mb-4">
        <div class="mb-3">
            <input type="text" class="form-control" id="textBusqueda" placeholder="Busca una peli...">
        </div>
        <button type="button" class="btn btn-primary" id="botoBuscar">Buscar</button>
    </form>
    <section id="Peli" class="d-flex flex-wrap justify-content-center gap-3">
    </section>


    <script src="app.js"></script>
</body>
</html>
